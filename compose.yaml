services:
  agent-bus-control-plane:
    build: .
    container_name: agent-bus-control-plane
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${AGENT_BUS_WRITE_TOKEN_FILE:-/home/ajbarfoot/.config/agent-bus/write-token.env}
    environment:
      AGENT_BUS_ROOT: /data
      AGENT_BUS_HOST: 127.0.0.1
      AGENT_BUS_PORT: 8091
      AGENT_BUS_BASE_PATH: /agent-bus
      AGENT_BUS_LOG_DIR: /logs
      AGENT_BUS_SELECTOR_PATH: /selector
      AGENT_BUS_ROLE_WAKE_CREDENTIALS_FILE: /run/secrets/role-wake-credentials.json
    volumes:
      - ${AGENT_BUS_DATA_DIR:-../runtime}:/data
      - ${HOME}/var/log/home-platform/agent-bus:/logs
      - ${AGENT_BUS_SELECTOR_DIR:-/srv/kv/vault/it-setup/llm-selector/v3}:/selector:ro
      - ${AGENT_BUS_ROLE_WAKE_CREDENTIALS_FILE:-/home/ajbarfoot/.config/agent-bus/role-wake/role-wake-credentials.json}:/run/secrets/role-wake-credentials.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
