apiVersion: arch.kv/v1
kind: Decision
id: 0023-bootstrap-a6-zulip-from-a-scoped-1password-service-account
namespace: project:agent-bus
title: "Bootstrap A6 Zulip from a scoped 1Password service account"
status: active
owner: tony
properties:
  date: 2026-08-28
  component: global
  context: |
    The AntlerForge Zulip deployment is the estate's first unattended A6
    consumer of 1Password CLI. Platform ADR-0006 and invariant I-002 require
    application secrets to be fetched at service start rather than committed
    or copied into environment files. A headless 1Password client nevertheless
    needs one bootstrap service-account token. Tony explicitly authorized a
    role-specific credential and an owner-only token path on A6.
  decision: |
    Use the dedicated 1Password vault "AntlerForge Deployments", item
    "zulip-antlerforge", and service account "A6 Zulip AntlerForge". Grant the
    service account read-items access to that vault only, with no vault-creation,
    write, share, or Environment permission.

    Store its one-time bootstrap token only at
    /etc/1password/service-accounts/zulip-antlerforge.token, owned by root:root
    with mode 0600. This file is a narrow, explicit bootstrap exception to
    platform I-002: it is never committed, backed up, logged, copied into an
    env file, or exposed to containers. A root-only launcher validates the
    file metadata, reads the token into OP_SERVICE_ACCOUNT_TOKEN for the op
    process, and then uses op run with an env file containing secret references
    only. Every application, database, cache and SMTP secret remains in the
    named 1Password item and is fetched at each start.

    The stack fails closed when the token, reference file, CLI, item, field or
    permission is missing. Rotation creates a replacement immutable service
    account with the same scope, atomically replaces the owner-only token file,
    and restarts the stack. No Agent Bus credential or Zulip relay is introduced
    in this phase.
  consequences:
    positive: |
      A6 can start Zulip unattended with least-privilege access while all
      workload secrets remain centrally managed and rotatable in 1Password.
    negative: |
      The root-only bootstrap token exists as plaintext on A6, a bounded and
      auditable exception required by the headless 1Password authentication
      model. Root compromise can read the named deployment vault.
    neutral: |
      1Password service-account permissions are immutable; expanding scope
      requires replacement rather than editing the account.
  supersedes: null
  superseded_by: null
relations:
  - to: ExternalSystem:project:agent-bus/zulip-server
    type: governs
  - to: Decision:project:agent-bus/0020-run-zulip-as-a-governed-conversation-layer-trial
    type: extends
source: decisions/0023-bootstrap-a6-zulip-from-a-scoped-1password-service-account.yaml
last_verified: "2026-08-28"
