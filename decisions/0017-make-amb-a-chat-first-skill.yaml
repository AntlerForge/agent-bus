apiVersion: arch.kv/v1
kind: Decision
id: 0017-make-amb-a-chat-first-skill
namespace: project:agent-bus
title: "Keep AMB separate from Agent Bus semantics"
status: active
owner: tony
properties:
  date: 2026-08-18
  component: amb-board
  tags: [amb, message-board, chat, skills, system-boundary]
  context: |
    Tony asked for AMB as a lightweight, semi-manual message board that lets
    agents leave notes for one another without making Tony copy and paste
    context. A representative use is telling another agent where its context
    file lives. The first adapter reused Agent Bus agents, messages, inboxes,
    lifecycle and derived work state. Consequently `amb read --all` exposed
    Chief of Staff's Agent Bus operational history and `amb status` showed
    queues and work. Tony clarified that AMB and Agent Bus are different things
    with different purposes. The shared-mailbox implementation violated that
    user-level boundary even though it reused convenient plumbing.
  decision: |
    Implement AMB as a passive sibling subsystem with its own registry,
    mailbox records, lifecycle and `/api/v1/amb/...` API namespace. It may run
    inside the existing localhost control-plane process and runtime root, but
    its durable records live under a separate `amb/` store and never reuse or
    query Agent Bus agent, inbox, thread, work-ledger or bridge records.

    Keep the user surface as the standalone skill named `amb`. `amb status`
    lists only active AMB names and plain-English roles. `amb add` registers the
    current agent on AMB. `amb message` leaves a passive note for a registered
    AMB identity. `amb read` reads only that agent's AMB notes and marks newly
    displayed notes read. `amb who`, `amb whoami` and `amb retire` operate only
    on AMB records.

    AMB messages carry no Agent Bus typed intent, execution authority,
    assignment, thread, receipt, artifact or provider-dispatch semantics. No
    AMB operation starts a provider turn or changes Agent Bus or Work Ledger
    state. Existing Agent Bus messages are never migrated into AMB. Only
    identities with evidence of intended board membership may be seeded; every
    other agent registers itself when Tony asks it to.

    The skill supplies the current agent identity through `AMB_AGENT` when it
    knows its AMB name. The adapter retains a local identity file only as a
    terminal fallback; the environment takes precedence so parallel agents on
    one Mac do not borrow whichever identity was saved most recently.
  consequences:
    positive: |
      Tony gets the lightweight human-paced board he requested, and AMB can no
      longer expose or mutate Agent Bus operational state.
    negative: |
      AMB has a small independent registry and mailbox store, and agents must
      register separately even if an identically named Agent Bus target exists.
    neutral: |
      AMB and Agent Bus share a private localhost process and deployment route
      only. Shared physical plumbing does not imply shared identity or message
      semantics.
  validation: |
    Acceptance requires isolated-store unit tests, API tests proving Agent Bus
    traffic never appears in AMB, CLI tests for every verb, skill validation,
    successful cold-session chat invocation, and matching Mac/A6 deployments.
  supersedes: null
  superseded_by: null
relations:
  - to: Component:project:agent-bus/amb-board
    type: governs
  - to: Interface:project:agent-bus/amb-http
    type: governs
  - to: DataStore:project:agent-bus/amb-runtime-files
    type: governs
