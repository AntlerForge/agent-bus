apiVersion: arch.kv/v1
kind: Decision
id: 0022-seat-persistent-roles-through-explicit-occupancy
namespace: project:agent-bus
title: "Seat persistent roles through explicit occupancy records"
status: active
owner: tony
properties:
  date: 2026-08-28
  component: bus-core
  tags: [role-wake, seating, occupancy, watcher-gap]
  source_ref: vault:holding-pen/2026-08-28-role-wake-on-demand-requirements.md
  context: |
    Scheduled role cadences left response-required work waiting for days. Agent last_seen
    cannot prove occupancy because scheduled automations also act under role identities.
  decision: |
    Agent Bus owns an explicit seat/wake record for each persistent role. Tony, the Chief
    of Staff, or the Estate Operations Manager may enqueue any role wake on their own judgement
    through a typed MCP/control-plane boundary authenticated with a distinct scoped credential. A
    Mac worker atomically claims one request, writes the occupied seat before spawning a
    fresh bounded role session at that role's desk, heartbeats a fenced seat generation,
    concurrently supervises other role seats, and always writes the unseat outcome. A later
    same-host worker recovers an expired heartbeat only after its own worker credential proves
    the recorded worker is dead and it has identified and stopped the exact token-marked child.
    An occupied seat makes subsequent wakes a recorded no-op and a retrying idempotent outbox
    delivers the reason to the occupant. The session identity is the
    canonical role and waking conveys no authority beyond its role charter.
    An independently scoped A6 monitor may signal only the Estate Operations Manager when
    response-required messages, waiting runs or pending reviews exceed the EOM-owned thresholds,
    and requests a routine patrol without changing alerting policy v1. The EOM-owned contract is
    five-minute mechanical evaluation; 4h active-recipient unread, 4h waiting-run unless a later
    declared gate applies, 24h from the current review-entry transition, and a maximum 4h between
    completed monitor-owned EOM passes. Per-transition episode keys, a durable pre-submit snapshot,
    idempotent signal replay, pending-context merge and one occupant note per episode prevent
    whole-set churn from causing duplicate wakes. A health timer checks both the monitor snapshot
    and the Mac worker heartbeat at a 15-minute freshness bound.
  consequences:
    positive: "Wake latency is bounded by the one-minute worker cadence, roles do not block each other, and seat contention is mechanically prevented."
    negative: "On-demand seating waits for the Mac worker when the Mac is unavailable."
    neutral: "Operational wake signals create no Tony notification and confer no extra role authority."
  supersedes: null
  superseded_by: null
