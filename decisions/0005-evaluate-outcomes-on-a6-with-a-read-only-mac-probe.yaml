apiVersion: arch.kv/v1
kind: Decision
id: 0005-evaluate-outcomes-on-a6-with-a-read-only-mac-probe
namespace: project:agent-bus
title: "Evaluate outcome contracts on A6 with a minimal Mac reporter"
status: active
owner: tony
properties:
  date: 2026-07-18
  component: outcome-truth-sentinel
  tags: [stage-1, outcomes, monitoring, cross-host]
  context: |
    Stage 1 requires semantic checks spanning A6 and the Mac. A Mac-side reporter would add
    another scheduled writer and another silent-failure mode. Direct A6-to-Mac SSH was tested
    and refused because macOS Remote Login is intentionally not exposed. The Mac already has
    an outbound private SSH path to A6.
  decision: |
    Run the declarative outcome sentinel and its card store on A6. For Mac-only facts, install
    one reversible LaunchAgent that executes a bounded read-only probe and copies its JSON
    snapshot over the existing outbound SSH path to A6. Add no credential or listening port.
    Treat stale/missing reporter snapshots as a hard semantic failure. Run a separate A6
    systemd dead-man timer that checks
    the sentinel heartbeat without depending on the sentinel process, matrix evaluator, or
    card store. Notify through the existing Home Assistant ALERT/INFO channel only.
  consequences:
    positive: "A6 remains the single inspectable authority and the single Mac LaunchAgent is reversible."
    negative: "Mac checks depend on the existing outbound private SSH path and reporter freshness."
    neutral: "SpanielBus slots are reserved but disabled; HA entity availability and auto-remediation remain excluded."
  supersedes: null
  superseded_by: null
