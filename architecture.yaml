id: zulip-server
namespace: project:agent-bus
title: "Self-hosted Zulip conversation layer"
description: |
  Phase-1 trial stack hosted on A6 and exposed only through the declared
  Cloudflare Tunnel and Access gate. It is conversation infrastructure, not
  Agent Bus transport or Work Ledger authority. Relay and publisher processes
  remain absent until their separately gated phase.
