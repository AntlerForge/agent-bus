status: active
properties:
  deployment_path: "deploy/antler-a6/zulip"
  runtime: "official Docker Compose topology"
  image: "ghcr.io/zulip/zulip-server:12.2-0@sha256:765f0ab3caa49041989132ee1879d98dbab1df7695c27e713eac1f114d167755"
  loopback_port: 8093
  data_root: "/srv/projects/Personal/zulip-estate/data"
  phase: "Gate G0 only; no estate data, relay, publisher or Bus credential"
