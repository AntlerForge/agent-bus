apiVersion: arch.kv/v1
kind: Project
id: agent-bus
namespace: project:agent-bus
title: "Agent Bus and Agent Work Ledger"
description: |
  Local-first transport and an adjacent control plane for Tony and trusted agents.
  Does: exchange durable agent messages, track delegated work, expose a private dashboard,
  preserve auditable receipts, surface advisory model-routing guidance, and host the
  separately namespaced passive AMB message board.
  Does not: replace provider runtimes, absorb the Knowledge Vault or become the authority for every human task.
owner: tony
status: active
tags: [nodejs, mcp, agents, home-platform]
relations:
  - to: Platform:platform/home-platform
    type: supports
source: architecture.yaml
last_verified: "2026-08-02"
---
apiVersion: arch.kv/v1
kind: Component
id: bus-core
namespace: project:agent-bus
title: "Agent Bus Core"
description: |
  Does: persist messages, threads, agents and artifacts and expose MCP transport tools.
  Does not: own delegated-work lifecycle or infer task completion from message delivery.
owner: tony
status: active
properties:
  path: "src/mailbox.mjs"
  tech: "Node.js, Markdown and JSON"
  responsibilities:
    - "Persist human-readable agent messages and threads"
    - "Expose bounded MCP messaging tools"
    - "Persist explicit role seat occupancy and on-demand wake requests"
    - "Authenticate sanctioned wake callers, Mac worker recovery and operational signals with separate scoped credentials"
  non_responsibilities:
    - "Task authority, scheduling or review policy"
    - "Deriving role occupancy from agent last_seen or bridge liveness"
relations:
  - to: Interface:project:agent-bus/agent-bus-mcp
    type: exposes
  - to: DataStore:project:agent-bus/bus-runtime-files
    type: writes-to
---
apiVersion: arch.kv/v1
kind: Component
id: role-attention-monitor
namespace: project:agent-bus
title: "Role attention monitor"
description: |
  Does: detect aged response-required messages, waiting runs and pending reviews and request an EOM patrol seating.
  Does not: notify Tony, approve work, change work state or wake roles other than the Estate Operations Manager.
owner: estate-operations-manager
status: active
properties:
  path: "scripts/role-attention-monitor.mjs"
  tech: "Node.js and systemd timer"
  responsibilities:
    - "Raise transition-bounded stalled-work signals"
    - "Request routine EOM patrols at the configured few-hourly cadence"
  non_responsibilities:
    - "Alerting-policy changes, Tony notifications or work-item mutation"
relations:
  - to: Component:project:agent-bus/bus-core
    type: depends-on
  - to: Interface:project:agent-bus/control-plane-http
    type: consumes
---
apiVersion: arch.kv/v1
kind: Component
id: amb-board
namespace: project:agent-bus
title: "AMB passive message board"
description: |
  Does: persist AMB-only identities and passive notes and expose the small AMB API.
  Does not: reuse Agent Bus records, start provider work or carry governed-work semantics.
owner: tony
status: active
properties:
  path: "src/amb-board.mjs"
  tech: "Node.js, Markdown and JSON"
  responsibilities:
    - "Persist a separate human-readable AMB registry and per-agent inbox"
    - "Persist AMB-only recent-work metadata and human-readable chat locators"
    - "Expose passive register, refresh, topic-find, message, read and retire operations"
    - "Keep AMB records isolated from Agent Bus and Work Ledger state"
  non_responsibilities:
    - "Agent Bus transport, threads, bridges, heartbeats or artifacts"
    - "Typed intent, execution authority, assignments, runs, reviews or receipts"
relations:
  - to: Interface:project:agent-bus/amb-http
    type: exposes
  - to: DataStore:project:agent-bus/amb-runtime-files
    type: writes-to
