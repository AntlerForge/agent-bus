apiVersion: arch.kv/v1
kind: Project
id: agent-bus
namespace: project:agent-bus
title: "Agent Bus and Agent Work Ledger"
description: |
  Local-first transport and an adjacent control plane for Tony and trusted agents.
  Does: exchange durable agent messages, track delegated work, expose a private dashboard,
  preserve auditable receipts and surface advisory model-routing guidance.
  Does not: replace provider runtimes, absorb the Knowledge Vault or become the authority for every human task.
owner: tony
status: active
tags: [nodejs, mcp, agents, home-platform]
relations:
  - to: Platform:platform/home-platform
    type: supports
source: architecture.yaml
last_verified: "2026-07-15"
---
apiVersion: arch.kv/v1
kind: Component
id: bus-core
namespace: project:agent-bus
title: "Agent Bus Core"
description: |
  Does: persist messages, threads, agents and artifacts and expose MCP transport tools.
  Does not: own delegated-work lifecycle or infer task completion from message delivery.
owner: tony
status: active
properties:
  path: "src/mailbox.mjs"
  tech: "Node.js, Markdown and JSON"
  responsibilities:
    - "Persist human-readable agent messages and threads"
    - "Expose bounded MCP messaging tools"
  non_responsibilities:
    - "Task authority, scheduling or review policy"
relations:
  - to: Interface:project:agent-bus/agent-bus-mcp
    type: exposes
  - to: DataStore:project:agent-bus/bus-runtime-files
    type: writes-to
---
apiVersion: arch.kv/v1
kind: Component
id: agent-adapters
namespace: project:agent-bus
title: "Agent Runtime Adapters"
description: |
  Does: connect provider-native sessions to Agent Bus on the host where each runtime lives.
  Does not: become the durable task store or require every agent runtime to execute on A6.
owner: tony
status: active
properties:
  path: "src/codex-bridge.mjs"
  tech: "Node.js provider adapters"
  responsibilities:
    - "Resume or create provider-native execution sessions"
    - "Relay requests and receipts through Agent Bus"
    - "Heartbeat live bridges and preserve one provider session per message thread"
    - "Materialize remote artifacts into bounded host-local bridge storage"
  non_responsibilities:
    - "Durable work-item authority"
---
apiVersion: arch.kv/v1
kind: Component
id: ha-notification-channel
namespace: project:agent-bus
title: "Home Assistant notification and approval channel"
description: |
  Does: send deduplicated ALERT/APPROVAL/INFO mobile notifications and capture stable-id
  actionable responses on A6. Does not: own approval authority, store HA credentials,
  expose the control plane to the LAN or modify Home Assistant configuration.
owner: tony
status: active
properties:
  path: "scripts/ha-notify-tony.mjs"
  tech: "Node.js, Home Assistant REST and WebSocket APIs"
  responsibilities:
    - "Deliver visually distinct notifications using stable idempotency identifiers"
    - "Capture YES/NO mobile actions into bounded A6 runtime records"
    - "Route every notification to a rendered private status or detail page"
  non_responsibilities:
    - "Work-item approval decisions or Home Assistant configuration ownership"
relations:
  - to: DataStore:project:agent-bus/bus-runtime-files
    type: writes-to
---
apiVersion: arch.kv/v1
kind: Component
id: outcome-truth-sentinel
namespace: project:agent-bus
title: "Outcome-truth exception sentinel"
description: |
  Does: evaluate versioned semantic outcome contracts on A6, persist deduplicated cards,
  consume a read-only Mac snapshot, and notify state transitions through Home Assistant.
  Does not: remediate failures, monitor HA entity availability, implement SpanielBus checks,
  or use APPROVAL notifications.
owner: tony
status: active
properties:
  path: "src/outcome-truth/"
  tech: "Node.js, YAML, systemd and a minimal macOS LaunchAgent reporter"
  responsibilities:
    - "Evaluate declared semantic recovery contracts"
    - "Persist stable exception cards and transition-only notifications"
    - "Expose an independently monitored heartbeat"
    - "Regenerate the durable Estate Status projection after every evaluation"
    - "Classify missing or untyped observations as probe faults, distinct from outcome failures"
  non_responsibilities:
    - "Auto-remediation, telemetry monitoring or approval authority"
relations:
  - to: Component:project:agent-bus/ha-notification-channel
    type: depends-on
  - to: DataStore:project:agent-bus/outcome-card-files
    type: writes-to
---
apiVersion: arch.kv/v1
kind: Component
id: decision-queue
namespace: project:agent-bus
title: "Waiting-on-Tony decision queue"
description: |
  Does: read authoritative A6 stores, normalise age/SLA state, and produce a bounded
  decision pack. Does not: approve work, mutate KV records, or integrate with the KV dashboard.
owner: tony
status: active
properties:
  path: "scripts/decision-queue.mjs"
  tech: "Node.js, YAML and systemd"
  responsibilities:
    - "Aggregate declared waiting states without changing their source stores"
    - "Emit transition-only SLA alerts and a weekly INFO decision pack"
    - "Render queue breach summaries and refresh the shared Estate Status projection"
  non_responsibilities:
    - "Approval authority, automatic expiry, or dashboard integration"
relations:
  - to: Component:project:agent-bus/ha-notification-channel
    type: depends-on
---
apiVersion: arch.kv/v1
kind: Component
id: agent-directory
namespace: project:agent-bus
title: "Agent Directory"
