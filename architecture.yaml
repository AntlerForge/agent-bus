apiVersion: arch.kv/v1
kind: Component
id: work-ledger
namespace: project:agent-bus
title: "Agent Work Ledger"
description: |
  Does: own work items, assignments, runs, append-only events, receipts, review gates and usage records.
  Does not: duplicate source-task authority or store private model reasoning.
owner: tony
status: active
properties:
  path: "src/work-ledger/"
  tech: "Node.js, Markdown and JSON"
  responsibilities:
    - "Validate and persist delegated-work lifecycle records"
    - "Calculate current state from auditable records"
  non_responsibilities:
    - "Message transport, provider execution or source backlog ownership"
relations:
  - to: DataStore:project:agent-bus/work-ledger-files
    type: writes-to
