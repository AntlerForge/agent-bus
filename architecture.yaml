apiVersion: arch.kv/v1
kind: Component
id: model-selector-adapter
namespace: project:agent-bus
title: "Model Selector Adapter"
description: |
  Does: validate and expose the read-only Knowledge Vault selector v3 snapshot.
  Does not: score models, mutate the Knowledge Vault, choose a provider runtime or dispatch work.
owner: tony
status: active
properties:
  path: "src/model-selector.mjs"
