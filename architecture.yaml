apiVersion: arch.kv/v1
kind: Invariant
id: p-001
namespace: project:agent-bus
title: "Transport and work authority stay separate"
owner: tony
status: active
properties:
  code: P-001
  statement: "Agent Bus owns message transport. Agent Work Ledger owns delegated-work lifecycle. Message or thread status must never be treated as task status."
---
apiVersion: arch.kv/v1
kind: Invariant
id: p-002
namespace: project:agent-bus
title: "Human source tasks remain authoritative"
owner: tony
status: active
properties:
  code: P-002
  statement: "Every imported or delegated work item links to its KV, software backlog or GitHub source through source_ref without silently replacing that authority."
---
apiVersion: arch.kv/v1
kind: Invariant
id: p-003
namespace: project:agent-bus
title: "Agent proposals require policy approval"
owner: tony
status: active
properties:
  code: P-003
  statement: "An agent may propose work, but a proposal cannot dispatch itself unless an explicit trusted policy permits that transition."
---
apiVersion: arch.kv/v1
kind: Invariant
id: p-004
namespace: project:agent-bus
title: "Completion requires a receipt"
owner: tony
status: active
properties:
  code: P-004
  statement: "A work item cannot enter done until it has a receipt recording outcome, evidence, deliverables, limitations and known usage."
---
apiVersion: arch.kv/v1
kind: Invariant
id: p-005
namespace: project:agent-bus
title: "Runtime state stays inspectable and recoverable"
owner: tony
status: active
properties:
  code: P-005
  statement: "Authoritative runtime records use atomic or append-only file operations and remain understandable without the dashboard. Raw chain-of-thought is never stored."
---
apiVersion: arch.kv/v1
kind: Invariant
id: p-006
namespace: project:agent-bus
title: "Model routes remain advisory"
owner: tony
status: active
properties:
  code: P-006
  statement: "A selector recommendation or workflow template may prefill a proposal, but it cannot approve, assign, dispatch or complete work."
---
apiVersion: arch.kv/v1
kind: Flow
id: outcome-evaluation-to-card-transition
namespace: project:agent-bus
title: "Semantic outcome evaluation to exception transition"
owner: tony
status: active
properties:
  trigger: "A6 outcome timer fires every 15 minutes"
  steps:
    - "Mac reporter atomically publishes its read-only snapshot to A6"
    - "Sentinel evaluates every enabled matrix contract against authoritative observations"
    - "Card store opens, deduplicates or closes a stable card based on semantic state"
    - "Only new hard failures and recoveries emit HA ALERT transitions"
    - "Independent dead-man timer verifies sentinel heartbeat freshness"
  data: [matrix_version, observation, card_id, semantic_state, transition]
relations:
  - to: Component:project:agent-bus/outcome-truth-sentinel
    type: depends-on
  - to: Component:project:agent-bus/ha-notification-channel
    type: depends-on
---
apiVersion: arch.kv/v1
kind: Flow
id: proposal-to-ready-work
namespace: project:agent-bus
title: "Proposal to approved work"
owner: tony
status: active
properties:
  trigger: "Tony or a trusted agent proposes delegated work"
  steps:
    - "Control plane validates the proposal"
    - "Work Ledger records the proposed work item and creation event"
    - "Tony or an explicit policy promotes the item to ready"
  data: [work_item, source_ref, context_ref, budget, review_policy]
relations:
  - to: Component:project:agent-bus/control-plane
    type: depends-on
  - to: Component:project:agent-bus/work-ledger
    type: depends-on
---
apiVersion: arch.kv/v1
kind: Flow
id: assignment-to-agent-run
namespace: project:agent-bus
title: "Assignment to agent execution"
owner: tony
status: active
properties:
  trigger: "Approved work is assigned to an agent"
  steps:
    - "Work Ledger records assignment and queued run"
    - "Agent Bus transports the bounded request"
    - "A host-local adapter acknowledges delivery and materializes referenced artifacts"
    - "The adapter starts or resumes the provider-native session for that thread"
    - "The adapter returns the provider reply on the same thread and records terminal transport status"
    - "Run events and usage are returned to the ledger"
  data: [work_item_id, assignment_id, run_id, thread_id, provider_session_ref]
relations:
  - to: Component:project:agent-bus/work-ledger
    type: depends-on
  - to: Component:project:agent-bus/bus-core
    type: depends-on
  - to: Component:project:agent-bus/agent-adapters
    type: depends-on
---
apiVersion: arch.kv/v1
kind: Flow
id: receipt-to-reviewed-completion
namespace: project:agent-bus
title: "Receipt to reviewed completion"
owner: tony
status: active
properties:
  trigger: "An agent submits its work result"
  steps:
    - "Work Ledger stores a completion receipt and submitted event"
    - "Configured human or independent-agent review runs"
    - "Approved work enters done and remains linked to its source task"
  data: [receipt, evidence, artifacts, usage, review_decision]
relations:
  - to: Component:project:agent-bus/work-ledger
    type: depends-on
  - to: Component:project:agent-bus/control-plane
    type: depends-on
---
apiVersion: arch.kv/v1
kind: Flow
id: selector-to-routing-proposal
namespace: project:agent-bus
title: "Selector guidance to reviewed work proposal"
owner: tony
status: active
properties:
  trigger: "Tony or an agent asks how to route a task or selects a workflow template"
  steps:
    - "Model Selector Adapter reads and validates the read-only KV selector snapshot"
    - "Control Plane presents current models, access surfaces, evidence confidence and advisory routes"
    - "Tony or an agent may prefill a proposed work item from a route or workflow template"
    - "Work Ledger applies its normal approval and assignment gates before any provider session starts"
  data: [selector_version, model_id, surface_id, evidence_refs, route_id, work_item_proposal]
relations:
  - to: Component:project:agent-bus/model-selector-adapter
    type: depends-on
  - to: Component:project:agent-bus/control-plane
    type: depends-on
  - to: Component:project:agent-bus/work-ledger
    type: depends-on
