schema_version: 1
matrix_id: estate-outcome-truth-v1
evaluation_interval_minutes: 15
deadman_after_minutes: 35
shadow:
  days: 14
  alert_policy: new_hard_failures_only
checks:
  - id: mac-retired-local-bus-write
    area: authority
    owner: tony
    severity: hard
    source: mac.local_bus.unexpected_write_count
    operator: equals
    expected: 0
    recovery: unexpected local files are quarantined with an audit note and a later probe reports zero
  - id: kv-doctor-overall
    area: doctor
    owner: tony
    severity: hard
    source: doctor.status
    operator: equals
    expected: pass
    recovery: doctor.status equals pass in a later evaluation
  - id: a6-borg-hourly-freshness
    area: backup
    owner: tony
    severity: hard
    source: borg.newest_archive_age_minutes
    operator: at_most
    expected: 120
    recovery: a newly observed archive is at most 120 minutes old
  - id: a6-legacy-rsync-semantic-outcome
    area: backup
    owner: tony
    severity: hard
    source: borg.full_legacy_coverage
    operator: equals
    expected: true
    recovery: Borg is fresh and its declared source set covers all paths formerly protected by rsync
  - id: mac-a6-share-mount
    area: mac
    owner: tony
    severity: hard
    source: mac.mount_present
    operator: equals
    expected: true
    recovery: a later read-only Mac probe confirms the share is mounted
  - id: mac-reporter-freshness
    area: mac
    owner: tony
    severity: hard
    source: mac.report_age_minutes
    operator: at_most
    expected: 30
    recovery: a new Mac snapshot is observed within 30 minutes
  - id: mac-repo-risk-sweep-freshness
    area: repositories
    owner: tony
    severity: hard
    source: mac.repo_sweep.age_minutes
    operator: at_most
    expected: 11520
    recovery: the existing Mac reporter uploads a successful sweep no more than eight days old
  - id: mac-launchagent-share-mount
    area: mac
    owner: tony
    severity: hard
    source: mac.launchagents.share_mount.age_minutes
    operator: at_most
    expected: 480
    recovery: a later agent outcome timestamp is fresh for its declared schedule
  - id: mac-launchagent-runtime-check
    area: mac
    owner: tony
    severity: hard
    source: mac.launchagents.runtime_check.age_minutes
    operator: at_most
    expected: 120
    recovery: a later agent outcome timestamp is fresh for its declared schedule
  - id: mac-launchagent-developer-mirrors
    area: mac
    owner: tony
    severity: hard
    source: mac.launchagents.developer_mirrors.age_minutes
    operator: at_most
    expected: 720
    recovery: a later agent outcome timestamp is fresh for its declared schedule
  - id: mac-launchagent-project-store
    area: mac
    owner: tony
    severity: hard
    source: mac.launchagents.project_store.age_minutes
    operator: at_most
    expected: 240
    recovery: a later agent outcome timestamp is fresh for its declared schedule
  - id: kv-daily-synthesis-clean
    area: synthesis
    owner: tony
    severity: hard
    source: synthesis.latest_clean
    operator: equals
    expected: true
    recovery: a later scheduled synthesis completes with zero warnings
  - id: kv-daily-synthesis-run-freshness
    area: synthesis
    owner: tony
    severity: hard
    source: synthesis.latest_run_age_minutes
    operator: at_most
    expected: 1800
    recovery: a later synthesis run starts within the 30-hour daily schedule allowance
  - id: sentinel-sandbox-contract
    area: sentinel
    owner: tony
    severity: hard
    source: sandbox.ok
    operator: equals
    expected: true
    recovery: a later evaluation observes the induced contract healthy
reserved_checks:
  - id: spanielbus-bm2-freshness
    enabled: false
    exclusion: Tony explicitly excluded SpanielBus implementation from Stage 1
  - id: spanielbus-obd-freshness
    enabled: false
    exclusion: Tony explicitly excluded SpanielBus implementation from Stage 1
ignored_sources:
  - kv-spanielbus-sync
  - home_assistant.entity_availability
