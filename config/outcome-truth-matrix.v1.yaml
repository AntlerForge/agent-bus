schema_version: 1
matrix_id: estate-outcome-truth-v1
evaluation_interval_minutes: 15
deadman_after_minutes: 35
alert_after_minutes: 30
shadow:
  days: 14
  alert_policy: new_hard_failures_only
checks:
  - id: mac-retired-local-bus-write
    area: authority
    owner: tony
    severity: hard
    source: mac.local_bus.unexpected_write_count
    operator: equals
    expected: 0
    recovery: unexpected local files are quarantined with an audit note and a later probe reports zero
  - id: kv-doctor-overall
    area: doctor
    owner: tony
    severity: hard
    source: doctor.status
    operator: equals
    expected: pass
    recovery: doctor.status equals pass in a later evaluation
  - id: a6-borg-hourly-freshness
    area: backup
    owner: tony
    severity: hard
    source: borg.healthy
    operator: equals
    expected: true
    recovery: a successful completed backup or a recently started in-progress backup is observed within 120 minutes
  - id: a6-legacy-rsync-semantic-outcome
    area: backup
    owner: tony
    severity: hard
    source: borg.full_legacy_coverage
    operator: equals
    expected: true
    recovery: Borg is fresh and its declared source set covers all paths formerly protected by rsync
  - id: mac-a6-share-mount
    area: mac
    owner: tony
    severity: hard
    source: mac.contracts.share_mount.healthy
    operator: equals
    expected: true
    recovery: while the Mac is available, a later read-only probe confirms the share is mounted; normal sleep is suspended
  - id: mac-reporter-freshness
    area: mac
    owner: tony
    severity: hard
    source: mac.contracts.reporter.healthy
    operator: equals
    expected: true
    recovery: an available Mac uploads a new snapshot within 30 minutes; normal sleep is suspended
  - id: mac-repo-risk-sweep-freshness
    area: repositories
    owner: tony
    severity: hard
    source: mac.repo_sweep.age_minutes
    operator: at_most
    expected: 11520
    recovery: the existing Mac reporter uploads a successful sweep no more than eight days old
  - id: mac-launchagent-share-mount
    area: mac
    owner: tony
    severity: hard
    source: mac.contracts.share_mount.healthy
    operator: equals
    expected: true
    recovery: an available Mac reports the mount healthy; normal sleep is suspended
  - id: mac-launchagent-runtime-check
    area: mac
    owner: tony
    severity: hard
    source: mac.contracts.runtime_check.healthy
    operator: equals
    expected: true
    recovery: an available Mac reports a fresh runtime check; normal sleep is suspended
  - id: mac-launchagent-developer-mirrors
    area: mac
    owner: tony
    severity: hard
    source: mac.contracts.developer_mirrors.healthy
    operator: equals
    expected: true
    recovery: an available Mac reports a fresh developer-mirrors sync; normal sleep is suspended
  - id: mac-launchagent-project-store
    area: mac
    owner: tony
    severity: hard
    source: mac.contracts.project_store.healthy
    operator: equals
    expected: true
    recovery: an available Mac reports a fresh project-store sync; normal sleep is suspended
  - id: kv-daily-synthesis-clean
    area: synthesis
    owner: tony
    severity: hard
    source: synthesis.latest_clean
    operator: equals
    expected: true
    recovery: a later scheduled synthesis completes with required adapters, dashboard and semantic doctor checks healthy; review-gated and non-blocking advisories do not fail the contract
  - id: kv-daily-synthesis-run-freshness
    area: synthesis
    owner: tony
    severity: hard
    source: synthesis.latest_run_age_minutes
    operator: at_most
    expected: 1800
    recovery: a later synthesis run starts within the 30-hour daily schedule allowance
  - id: sentinel-sandbox-contract
    area: sentinel
    owner: tony
    severity: hard
    source: sandbox.ok
    operator: equals
    expected: true
    recovery: a later evaluation observes the induced contract healthy
  - id: estate-steward-freshness
    area: monitoring
    owner: tony
    severity: hard
    source: estate_steward.healthy
    operator: equals
    expected: true
    recovery: the Estate Steward publishes a valid contract 2.0 snapshot no more than five minutes old
reserved_checks:
  - id: spanielbus-bm2-freshness
    enabled: false
    exclusion: Tony explicitly excluded SpanielBus implementation from Stage 1
  - id: spanielbus-obd-freshness
    enabled: false
    exclusion: Tony explicitly excluded SpanielBus implementation from Stage 1
ignored_sources:
  - kv-spanielbus-sync
  - home_assistant.entity_availability
